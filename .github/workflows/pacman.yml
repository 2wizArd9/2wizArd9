name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */1 * * *"
  workflow_dispatch:

jobs:
  generate:

    permissions:
      contents: write

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:

      - name: Generate Snake Animation
        uses: Platane/snk@v3

        with:
          github_user_name: 2wizArd9

         outputs: |

          dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#ff00ff

          dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00f5ff

          dist/ocean.gif?color_snake=#00f5ff&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Push Snake Animation
        uses: crazy-max/ghaction-github-pages@v3

        with:
          target_branch: output
          build_dir: dist

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
