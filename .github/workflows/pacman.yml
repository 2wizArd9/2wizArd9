name: Contribution Snake (Platane/snk)

on:
  schedule:
    - cron: '0 */6 * * *' # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: 2wizArd9
          outputs: output/github-contribution-grid-snake.svg
          # Ensure it uses the default generated output location and commits/pushes.

      - name: Commit and push regenerated snake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/github-contribution-grid-snake.svg
          # Push changes to the output branch so README stays live.
          git checkout -B output
          git commit -m "chore: regenerate contribution snake" || echo "No changes to commit"
          git push --force origin output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

